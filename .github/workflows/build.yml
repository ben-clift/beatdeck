name: Check and build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time, so an older build can never overwrite the newer release.
concurrency:
  group: beatdeck-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Same Flutter version SideDeck pins in .metadata
      - name: Install Flutter
        run: |
          set -euo pipefail
          rev=$(sed -n -E 's/.*revision: "(.*)"/\1/p' .metadata | head -n1)
          test -n "$rev"
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$HOME/flutter"
          git -C "$HOME/flutter" fetch --depth 1 origin "$rev"
          git -C "$HOME/flutter" checkout --force FETCH_HEAD
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"

      - run: flutter config --no-analytics
      - name: flutter pub get
        run: |
          if ! flutter pub get > pub.txt 2>&1; then
            body=$(head -c 1500 pub.txt | tr '\n' ' ')
            echo "::error title=pub get failed::$body"
            exit 1
          fi

      # Errors are also written as annotations so they can be read without
      # downloading the full log.
      - name: Analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee analyze.txt
          grep -E '^\s+error •' analyze.txt | head -40 | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F ' • ' '{print $2}')
            loc=$(echo "$line" | awk -F ' • ' '{print $3}')
            file=$(echo "$loc" | cut -d: -f1)
            ln=$(echo "$loc" | cut -d: -f2)
            echo "::error file=$file,line=$ln::$msg"
          done
          exit 0

      - name: Test
        continue-on-error: true
        run: |
          set +e
          flutter test 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            body=$(tail -n 40 test.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=flutter test failed::$body"
          fi
          exit 0

      - name: Build debug APK (arm64 phones)
        run: |
          set +e
          flutter build apk --debug --target-platform=android-arm64 --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E 'Error:|error:|FAILURE|What went wrong' -A2 build.txt | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > errs.txt
            echo "::error title=APK build failed::$(cat errs.txt)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: beatdeck-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Also publish the newest APK on the Releases page, which is easy to
      # find on a phone.
      - name: Publish latest APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.2.${{ github.run_number }}"
          STAMP=$(TZ=Europe/London date +"%Y-%m-%d %H:%M")
          FILE="BeatDeck-v${VER}.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$FILE"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$FILE" --prerelease \
            --title "BeatDeck v${VER} - ${STAMP} (UK time)" \
            --notes "BeatDeck v${VER}, built ${STAMP} UK time, commit $(git rev-parse --short HEAD). Tap the APK to download."
